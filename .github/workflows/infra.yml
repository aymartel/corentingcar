name: Infra (Terraform)

# Provisiona la infraestructura AWS (EC2 + EIP + Security Group) en eu-west-1.
#   - Pull Request que toque infra/terraform/** -> solo `terraform plan`.
#   - Ejecución manual (workflow_dispatch) -> `terraform apply`.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

env:
  AWS_REGION: eu-west-1
  # Bucket de estado de Terraform (debe ser único en todo AWS; cámbialo si colisiona).
  TF_STATE_BUCKET: coretingcar-tfstate-aymartel

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Asegurar bucket de estado (S3)
        run: |
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Creando bucket de estado $TF_STATE_BUCKET"
            aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$TF_STATE_BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"

      - name: Terraform plan
        run: terraform plan -no-color -input=false

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve -no-color -input=false

      - name: Mostrar outputs (copia public_ip al secret EC2_HOST)
        if: github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "## Outputs de Terraform"
            echo '```'
            terraform output
            echo '```'
            echo "➡️ Copia **public_ip** al secret \`EC2_HOST\` y apunta el DNS A de tu dominio a esa IP."
          } >> "$GITHUB_STEP_SUMMARY"
